# Config de la prueba manual rtsp_streams.py, separada del config.yaml de la app.
#
# El puerto va distinto al de la app a propósito: así la prueba se puede correr con
# el sistema andando, sin pelearse por el 8554.

video:
  rtsp:
    enabled: true
    port: 8654
    codec: h264_sw              # h264_hw en la Jetson; mjpeg si faltan los plugins de x264
    fps: 15                     # el mismo ritmo al que genera frames el script
    frame_width_px: 0           # 1280 para ver el escalado; 0 = nativo (1920×1200)
    bitrate_kbps: 4000          # 0 = el del encoder; bajarlo a 500 se nota en la imagen
    # Para comparar codecs o bitrates: editar, guardar y volver a lanzar la prueba. El
    # archivo se lee una vez al arrancar.
    net_interfaces: []          # [] = todas; con nombres, solo esas responden
    log_connections: true       # en false, abrir y cerrar el reproductor no dice nada

# De esta sección el servidor sólo usa las claves: son los slots que van en la ruta
# (/camera_1/raw). Los campos de una cámara real —`name`, `driver`— no
# aparecen porque no lee ninguno; la ruta sale del slot, no del nombre.
cameras:
  camera_1: {}
  camera_2: {}
