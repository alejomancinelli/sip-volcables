# Mapa de registros Modbus — específico de la instalación.
#
# Es la fuente ÚNICA de verdad del mapa: de acá salen la tabla de la UI, la
# documentación para el integrador (`python -m system.modbus.export_map`) y las
# direcciones que el código pide por nombre con `SCHEMA.addr("...")`. Ninguna
# dirección se escribe como literal en otro archivo.
#
# Direccionamiento BASE-1: el registro 1 es el primer holding register, el que el
# PLC lee como 40001. Regla única: **reg N ⇔ 4000N**, sin off-by-one que traducir
# entre el código, la documentación y el integrador.
#
# Campos de cada entrada (ver `system/modbus/schema.py`):
#   addr      dirección base-1, única
#   name      id corto y único; es el nombre con el que el código lo pide
#   desc      texto humano; va a la UI y a la doc del integrador
#   producer  inference | health | config — quién escribe el registro
#   scale     registro = round(valor * scale). El productor entrega el valor
#             físico y el esquema escala; nadie multiplica por su cuenta.
#   unit      unidad del valor SIN escalar, para la doc
#   is_bool   codifica como 0/1
#
# Las filas `config` son un espejo R/W que el PLC puede escribir; este mapa no
# declara ninguna, porque en el template la configuración se edita sólo en el
# equipo. Los campos config_key / default / apply / mirror_from_config sólo
# aplican a esas filas.
#
# Este archivo es lo que cambia en cada fork. La maquinaria que lo lee, no.

# ── Palabras de estado (1-2) ─────────────────────────────────────────────────
- addr: 1
  name: system_status_bitfield
  desc: Estado del sistema (bitfield)
  producer: health

- addr: 2
  name: com_status_bitfield
  desc: Canales de comunicación (bitfield)
  producer: health

# ── Resultados de inferencia (3-50) ──────────────────────────────────────────
# Rango reservado, sin filas: el motor de inferencia ya corre, pero qué publica es lo
# más específico de cada proyecto y sale de `metrics.compute_metrics`, que se escribe
# en cada fork. El fork agrega acá sus filas con `producer: inference`.
#
# Al hacerlo, mantener INMUTABLE el mapeo posición → registro: si el resultado son
# fracciones por clase, el registro reporta siempre el mismo slot, y renombrar una
# clase o mover un umbral no cambia qué registro la transporta. El PLC no se
# reprograma porque en el equipo se haya editado un nombre.

# ── Cámaras (51-80) ──────────────────────────────────────────────────────────
# Bloque de 4 registros por cámara, con paso fijo: `camera_N` arranca en
# 51 + 4*(N-1) — camera_1 en 51, camera_2 en 55, camera_3 en 59, y así hasta
# camera_7 en 75. Abajo va sólo camera_1 como ejemplo: el fork copia el bloque y
# corre las direcciones para las cámaras que tenga declaradas en `cameras` del
# config.yaml.
- addr: 51
  name: camera_1_state_bitfield
  desc: Estado de la cámara 1 (bitfield)
  producer: health

- addr: 52
  name: camera_1_temperature_c
  desc: Temperatura de la cámara 1
  producer: health
  unit: °C
  scale: 10

- addr: 53
  name: camera_1_fps
  desc: Frames por segundo medidos de la cámara 1
  producer: health
  unit: fps
  scale: 10

- addr: 54
  name: camera_1_illumination_pct
  desc: Brillo medio del ROI de la cámara 1
  producer: inference
  unit: '%'

# ── Salud del equipo (81-99) ─────────────────────────────────────────────────
# Las claves espejan las de `SystemMonitor.get_metrics()`, para que el productor
# no tenga que traducir nombres en el camino.
- addr: 81
  name: heartbeat
  desc: Heartbeat / watchdog — cambia en cada ciclo mientras la app viva
  producer: health

- addr: 82
  name: cpu_usage_pct
  desc: CPU en uso
  producer: health
  unit: '%'

- addr: 83
  name: gpu_usage_pct
  desc: GPU en uso
  producer: health
  unit: '%'

- addr: 84
  name: ram_used_mb
  desc: RAM usada
  producer: health
  unit: MB

- addr: 85
  name: ram_total_mb
  desc: RAM total del equipo
  producer: health
  unit: MB

- addr: 86
  name: disk_free_gb
  desc: Espacio libre en disco
  producer: health
  unit: GB
  scale: 10

- addr: 87
  name: cpu_temp_c
  desc: Temperatura de CPU
  producer: health
  unit: °C
  scale: 10

- addr: 88
  name: gpu_temp_c
  desc: Temperatura de GPU
  producer: health
  unit: °C
  scale: 10

- addr: 89
  name: power_w
  desc: Consumo estimado
  producer: health
  unit: W
  scale: 10

# ── GPIO (90-91) ─────────────────────────────────────────────────────────────
# Una palabra para las entradas leídas y otra para las salidas comandadas; qué significa
# cada bit lo documenta `system/formats/gpio_status.py`. Salen siempre, haya GPIO o no:
# sin hardware llevan prendida la marca de «sin GPIO», para que el PLC no tome por una
# entrada en cero lo que es un equipo sin de dónde leerla.
- addr: 90
  name: gpio_inputs_bitfield
  desc: Entradas digitales (bitfield)
  producer: health

- addr: 91
  name: gpio_outputs_bitfield
  desc: Salidas digitales comandadas (bitfield)
  producer: health

# ── Reloj del equipo (98-99) ─────────────────────────────────────────────────
# El reloj del equipo como **segundos desde 1970-01-01 00:00 UTC**, en dos registros.
#
# **Para qué está: el PLC es el único reloj confiable que hay.** El vencimiento de la
# licencia se evalúa contra el reloj del equipo, y quien tiene admin en el equipo puede
# atrasarlo. El equipo no puede detectar eso solo —el estado que guarda vive en un disco
# que ese mismo admin controla—, pero el PLC sí: si esta fecha se aparta de la suya más de
# lo razonable, alguien movió el reloj. Comparar y alarmar es del programa del PLC; el
# equipo publica el dato y no juzga.
#
# **El registro de Modbus es de 16 bits siempre**: un valor de 32 bits viaja en dos, que es
# la práctica corriente y todo PLC sabe leer como DINT. Lo que el protocolo NO define es el
# orden de las dos palabras, y ahí es donde fallan estas integraciones:
#
#     98  palabra ALTA   (bits 31-16)
#     99  palabra BAJA   (bits 15-0)
#
#     epoch = (reg98 * 65536) + reg99
#
# Alta primero, en la dirección más baja. Si el PLC lee un DINT y da un número absurdo,
# está invirtiendo las palabras: casi todos los drivers tienen un `word swap` para eso.
#
# Los dos se leen en un solo FC03 pidiéndolos juntos, y así van del mismo tick. Aun leídos
# por separado el error máximo es de un segundo, y la tolerancia con la que se compara
# esto es de un día — que además se come cualquier diferencia de huso horario, así que no
# hay zona horaria que configurar en ningún lado.
#
# Leído como DINT **con signo** el valor da la vuelta en 2038; como unsigned llega a 2106.
- addr: 98
  name: clock_epoch_s_high
  desc: Reloj del equipo, palabra alta (epoch UTC = alta*65536 + baja)
  producer: health
  unit: s

- addr: 99
  name: clock_epoch_s_low
  desc: Reloj del equipo, palabra baja
  producer: health
  unit: s

# El bit de licencia dice que algo anda mal; esta fila dice cuánto falta para que
# empiece a andar mal, que es lo que permite alarmar con un mes de anticipación en vez
# de enterarse el día que la línea para. Una licencia perpetua publica un centinela alto
# y constante (9999); una vencida, sin licencia o con el reloj movido publica 0.
- addr: 100
  name: license_days_remaining
  desc: Días hasta el vencimiento de la licencia
  producer: health
  unit: días