# Mapa de registros Modbus — específico de la instalación.
#
# Es la fuente ÚNICA de verdad del mapa: de acá salen la tabla de la UI, la
# documentación para el integrador (`python -m system.modbus.export_map`) y las
# direcciones que el código pide por nombre con `SCHEMA.addr("...")`. Ninguna
# dirección se escribe como literal en otro archivo.
#
# Direccionamiento BASE-1: el registro 1 es el primer holding register, el que el
# PLC lee como 40001. Regla única: **reg N ⇔ 4000N**, sin off-by-one que traducir
# entre el código, la documentación y el integrador.
#
# Campos de cada entrada (ver `system/modbus/schema.py`):
#   addr      dirección base-1, única
#   name      id corto y único; es el nombre con el que el código lo pide
#   desc      texto humano; va a la UI y a la doc del integrador
#   producer  inference | health | config | plc — quién escribe el registro
#   scale     registro = round(valor * scale). El productor entrega el valor
#             físico y el esquema escala; nadie multiplica por su cuenta.
#   unit      unidad del valor SIN escalar, para la doc
#   is_bool   codifica como 0/1
#   min_value / max_value
#             rango aceptado, en la unidad física; sólo en filas plc.
#             Lo que el PLC escriba afuera se rechaza con la excepción 0x03.
#   bitfield  la fila es una palabra de estado, y cuál: system_status, com_status,
#             camera_health, pipeline_status, gpio_inputs o gpio_outputs (ver
#             `system/formats/catalog.py`). La interfaz la decodifica bit por bit.
#
# Las filas `plc` son lo que escribe el PLC (bloque 101-150) y las `config`, la copia de
# un valor de config.yaml que el equipo publica para el HMI (bloque de lectura); cada
# bloque explica la suya abajo, con ejemplos comentados. config_key (obligatorio) y
# default sólo aplican a las filas `config`.
#
# Este archivo es lo que cambia en cada fork. La maquinaria que lo lee, no.

# ── Palabras de estado (1-2) ─────────────────────────────────────────────────
- addr: 1
  name: system_status_bitfield
  desc: Estado del sistema (bitfield)
  producer: health
  bitfield: system_status

- addr: 2
  name: com_status_bitfield
  desc: Canales de comunicación (bitfield)
  producer: health
  bitfield: com_status

# ── Resultados de inferencia (3-50) ──────────────────────────────────────────
# Las filas no llevan la cámara sino la POSICIÓN: `grain_2_flow_ok` es el grano de la
# segunda posición de grano, sea cual sea la cámara que la ocupa. Qué cámara ocupa cada
# posición lo dice el config de cada planta (`inference.pipelines.<slot>.plc_prefix`), así
# que este mapa y el programa del PLC son los mismos en todas las plantas.
#
# El nombre es `<posición>_<métrica>`: la métrica es la clave que devuelve el analyzer
# (`metrics.py`) y es también el campo en InfluxDB, sin la posición —ahí la cámara va como
# tag—. Ninguna métrica se llama `confidence_pct` ni `detection_count`: son campos que el
# motor ya escribe en el mismo punto, y uno pisaría al otro. Lo que sirve para mirar y no
# para decidir —la confianza del grano, si se vio la calza o la rueda— va a InfluxDB y no
# tiene fila.
#
# PENDIENTE: la búsqueda por prefijo en `_build_metric_registers()` de main.py y el
# analyzer que da estas métricas. Hasta que estén, estas filas quedan en 0.
#
# Un bloque por función, con paso fijo y dimensionado para el peor caso; una posición que
# la planta no ocupa queda en 0. Los huecos son para crecer sin mover nada:
#
#   libres                     3-9    candidatos para las palabras de los pipelines
#   grano      grain_1..3     10-12   paso 1: cae grano
#   personas   person_1..5    20-29   paso 2: en el frame, en la zona
#   calzas     stopper_1..2   30-33   paso 2: levantada OK, contacto OK
#   libres                    34-50
#
# Mantener INMUTABLE el mapeo posición → registro: el PLC no se reprograma porque en el
# equipo se haya editado un nombre, una clase o un umbral.
#
# Acá van también los umbrales que el equipo publica para que el HMI los muestre: un
# valor del config, copiado y escalado en cada tick. El PLC los lee y no los escribe —una
# escritura da 0x02—; se cambian desde la interfaz o el archivo, y el registro lo sigue en
# el tick siguiente.
#
# - addr: 48
#   name: max_load_y_px_camera_1
#   desc: Altura del límite de carga en la cámara 1
#   producer: config
#   config_key: process.max_load_y_px.camera_1
#   unit: px

# Grano y calzas: 1 es OK y 0 es cualquier otra cosa —NOK, sin dato, sin calibrar, nada a
# la vista, o el contacto mientras la calza no está levantada—. El 0 es el estado seguro:
# un equipo que todavía no publicó, o una cámara sin calibrar, nunca da por bueno lo que
# no midió.
- addr: 10
  name: grain_1_flow_ok
  desc: Grano, posición 1 — 1 cae, 0 no cae o sin dato
  producer: inference
  is_bool: true

- addr: 11
  name: grain_2_flow_ok
  desc: Grano, posición 2 — 1 cae, 0 no cae o sin dato
  producer: inference
  is_bool: true

- addr: 12
